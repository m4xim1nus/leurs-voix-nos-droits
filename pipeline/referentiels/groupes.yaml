# Organes successifs d'un même groupe politique (AN).
#
# Quand un groupe change de nom, l'AN crée un nouvel organe, et les ventilations
# des scrutins mêlent parfois l'ancien et le nouveau (jamais les deux dans un même
# scrutin). Les positions restent calculées par organe, tel que publié. Les scores
# de groupe, eux, réunissent une lignée sous son organe le plus récent.
#
# nouvel organe: organe qu'il continue
#
# Sénat : rien à déclarer ici. Le code d'un groupe survit à ses changements de nom (UMP pour Les
# Républicains, LREM pour RDPI, CRC pour CRCE-K, RTLI pour Les Indépendants), donc chaque code est sa
# propre lignée. UNT, créé le 05/10/2026, ne continue aucun groupe : ses membres viennent de plusieurs.

suites:
  # Socialistes et apparentés, XVIe : sortie de l'intergroupe NUPES le 19/10/2023. Les
  # ventilations utilisent PO830170 dès le 14/12/2022 (8 scrutins) et PO800496 jusqu'au 14/03/2024.
  PO830170: PO800496
  # Groupe d'Éric Ciotti, XVIIe : « À Droite » (18/07/2024), « UDR » (12/09/2024), puis nouvel
  # organe du même nom le 05/09/2025 (15 des 16 membres de l'UDR y passent).
  PO847173: PO845520
  PO872880: PO847173
  # XVe, changements de nom. Nouvelle Gauche devient Socialistes et apparentés (12/09/2018) ; MoDem et apparentés
  # devient Mouvement Démocrate et Démocrates apparentés (24/09/2020).
  PO758835: PO730946
  PO774834: PO730970
  # XVe, même groupe sous cinq noms : Les Constructifs, UDI, Agir et Indépendants (29/11/2017), UDI et Indépendants
  # (11/06/2019), UDI, Agir et Indépendants (28/09/2019), UDI et Indépendants (26/05/2020). Agir ensemble, créé le
  # 27/05/2020 par des députés qui le quittent, ne continue aucun groupe.
  PO744425: PO730952
  PO765636: PO744425
  PO767217: PO765636
  PO771889: PO767217
