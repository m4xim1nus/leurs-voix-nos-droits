# Présélection des textes candidats par mots-clés (docs/METHODO.md).
#
# Aide au tri dans l'admin, jamais une qualification : un texte retenu ici
# n'est qu'un candidat, et un texte absent peut être qualifié. Les motifs sont
# des expressions régulières appliquées aux titres du dossier et de ses textes,
# normalisés : minuscules, sans accents ni ponctuation (lvnd.texte.norm).
# Chaque motif est encadré de limites de mot à gauche ; à droite, il peut
# s'agir d'un début de mot (« penal » trouve « penale », « penales »).
#
# Les codes suivent referentiels/droits.yaml (droits et étiquettes).

