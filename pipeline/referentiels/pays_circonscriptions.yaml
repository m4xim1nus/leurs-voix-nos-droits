# `hors_tableau` : pays et territoires que le tableau ne nomme pas, rattachés d'après le poste consulaire qui les
# couvre et la pratique électorale. Le site le dit à côté du résultat.
# `alias` : autres façons de chercher le même pays. Ce sont des clés de recherche, jamais affichées.

