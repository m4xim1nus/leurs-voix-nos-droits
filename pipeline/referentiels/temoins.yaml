# Textes témoins, qualification v0 (étape 1), validée par Max le 29/10/2026.
#
# Pour chaque texte :
#   droits     : un droit principal et des secondaires, avec leur sens
#                (`etend` / `restreint`, cf. droits.yaml) et les sources qui
#                fondent ce jugement (clés de `sources`).
#   vigilance  : critiques sourcées affichées à côté du jugement, sans le
#                modifier.
#   scrutins   : scrutins AN retenus. `pour` donne le sens d'un vote « pour » :
#                  texte        → voter pour va dans le sens du texte (le
#                                 texte lui-même, le rétablissement d'un de
#                                 ses articles, ou la suppression d'une
#                                 garantie qu'il contient) ;
#                  contre-texte → voter pour va contre le texte (motion de
#                                 rejet, suppression d'un article qui porte
#                                 une mesure citée par une source) ;
#                  a-trancher   → sens à fixer par Max (amendements candidats).
#                Le sens d'un amendement se lit sur le contenu de l'article,
#                jamais sur la seule nature de l'amendement.
#                `role` : decisif (dernier vote de l'AN sur l'ensemble),
#                ensemble (autres lectures), motion, article, amendement.
#                Seuls comptent le scrutin décisif et les amendements clés,
#                un seul scrutin par article ; motions et autres lectures sont
#                affichées, pas comptées. Pondération : docs/METHODO.md.
#
# On qualifie le texte soumis au scrutin décisif (c'est le vote du député qui
# est mesuré) ; la décision du Conseil constitutionnel est affichée à côté.
# Les identifiants AN, numéros de loi, NOR et décisions du Conseil
# constitutionnel ont été recoupés avec les dossiers AN (open data).

statut: valide

