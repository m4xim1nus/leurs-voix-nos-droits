# Clés de la recherche du site : ce que les gens tapent et que les titres officiels ne disent pas.
#
# Ces mots ne sont jamais affichés, ne jugent rien et n'entrent dans aucun score. Préparés hors ligne par Claude à partir
# du titre et du résumé de chaque texte (cycle Recherche, 2026-11-01). Relus et validés par Max le 01/11/2026.
#
# - `termes` : sigles et mots courants, chacun décrit par le texte lui-même ;
# - `surnoms` : uniquement les noms d'usage public de la loi (« loi Duplomb »), jamais une formule militante ;
# - ni nom de victime ou de personne mise en cause, ni marque sans lien direct avec le texte ;
# - `textes` : clés = `id` d'une qualification ou d'une fiche de suivi ; `ecartes` : clés = dossier de l'AN.
#
# Un texte absent reste trouvable par son titre et son résumé. `lvnd check` refuse les termes de la liste privée
# (source/termes_interdits.txt) ; il signale sans bloquer les textes qualifiés sans terme et les clés dont le texte a changé
# de statut (la clé d'un écarté devenu qualifié suit d'elle-même ; celle d'un qualifié devenu écarté est à déplacer).

