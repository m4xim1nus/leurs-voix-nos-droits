# Flux suivis par la veille des sources (ROADMAP, cycle Pré-qualification, item 7 ; `lvnd veille`).
#
# Une fois par semaine, le pipeline lit ces flux RSS ou Atom, sans LLM, et garde les publications des derniers jours.
# Un appel au LLM les rapproche ensuite des textes publiés (qualifiés, suivis, écartés faute de source) ; seule une
# correspondance donne une proposition complète, dans « À traiter ».
#
# Règles :
# - seulement des sources admises par la règle 7 (docs/METHODO.md), à l'échelon national ; `categorie` dit à quel
#   titre ;
# - jamais une organisation de la liste d'exclusion (`lvnd check` refuse ce fichier sinon) ; une publication collective
#   reste contrôlée par ses signataires, comme toute proposition ;
# - une source sans flux n'est pas suivie ici (Conseil d'État, Syndicat de la magistrature, CNB, FNE, APF…) : la
#   recherche des propositions la trouve encore, au cas par cas. Les décisions du Conseil constitutionnel viennent de
#   l'open data.
#
# Flux sondés le 02/11/2026 ; celui de l'Inter-LGBT, mal formé ce jour-là, n'est pas repris. Statut : brouillon, à
# valider par Max.

statut: brouillon

