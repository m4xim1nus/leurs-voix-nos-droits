# Propositions du LLM (ROADMAP, cycle Pré-qualification, item 5) : après chaque passe de données réussie,
# une proposition par nouvelle alerte, contrôlée, écrite dans D1 (table propositions) ; l'admin la montre dans
# « À traiter ». Le LLM propose, il ne valide ni ne publie : rien n'est commité ici. Puis, à part, des résumés en
# mots simples pour les textes validés qui n'en ont pas d'à jour (cycle Facile à lire, `lvnd resumer`).
#
# À part des passes de données : un échec ou un plafond atteint n'y touche pas. Interrupteur, clé (chiffrée)
# et plafond se règlent sur la page « LLM » de l'admin ; coupé, l'Action s'arrête sans appel.
# Secrets : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (D1), LLM_CHIFFREMENT (clé), TERMES_INTERDITS
# (liste d'exclusion : sans elle, aucune proposition).

name: Propositions

on:
  workflow_run:
    workflows: ['Données AN', 'Données AN (quotidien)']
    types: [completed]
  workflow_dispatch:
    inputs:
      max:
        description: Propositions au plus
        default: '5'
      max_simples:
        description: Résumés en mots simples au plus
        default: '5'

concurrency:
  group: propositions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propositions:
    name: Propositions sur les nouvelles alertes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LLM_CHIFFREMENT: ${{ secrets.LLM_CHIFFREMENT }}
      TERMES_INTERDITS: ${{ secrets.TERMES_INTERDITS }}
    steps:
      - name: Configuration
        run: |
          for s in CLOUDFLARE_API_TOKEN LLM_CHIFFREMENT TERMES_INTERDITS; do
            if [ -z "${!s}" ]; then echo "::notice::secret $s absent : aucune proposition."; echo "SAUTER=1" >> "$GITHUB_ENV"; fi
          done

      - uses: actions/checkout@v6
        if: env.SAUTER != '1'
        with:
          ref: main # données du dernier commit de la passe

      - uses: astral-sh/setup-uv@v7
        if: env.SAUTER != '1'
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/setup-node@v5
        if: env.SAUTER != '1'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Propositions (lvnd proposer --alertes)
        if: env.SAUTER != '1'
        env:
          # Types retenus par Max le 02/11/2026 : les votes de l'Assemblée. Pas `inscrit` (rien à qualifier avant le
          # vote) ni le Sénat (pas encore essayé) : ceux-là sur demande, depuis « À traiter » (table demandes_llm).
          TYPES: premier_decisif,vote_sans_decisif,unanimite_contestee,ecart_revote,vote_posterieur,lecture_posterieure
        run: |
          (cd admin && npm ci --no-audit --no-fund)
          cd pipeline && uv run --no-dev lvnd proposer --alertes --remote --max "${{ inputs.max || '5' }}" --types "$TYPES"

      # Cycle Facile à lire : un résumé en mots simples proposé pour chaque texte validé qui n'en a pas d'à jour,
      # quelques-uns par passe (environ 0,03 $ chacun). Indépendant de l'étape précédente : il tourne même si elle
      # a échoué, et son échec ne la touche pas.
      - name: Résumés en mots simples (lvnd resumer)
        if: always() && env.SAUTER != '1'
        run: cd pipeline && uv run --no-dev lvnd resumer --remote --max "${{ inputs.max_simples || '5' }}"
