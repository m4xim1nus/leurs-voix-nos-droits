# Tests à chaque push et PR (repris de quifaitlaloi), puis build complet du site public
# (build.sh, comme Cloudflare Pages). L'admin se déploie à la main (admin/README.md).

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (pipeline, admin et site)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            site/package-lock.json

      # Une publication depuis l'admin ne change que data/editorial.json : on recalcule les scores
      # versionnés (comme build.sh) pour que les tests comparent des fichiers à jour.
      - name: Scores (lvnd scores)
        working-directory: pipeline
        run: uv run --quiet lvnd scores

      - name: Tests pipeline (les tests `donnees` exigent la base locale, sautés en CI)
        working-directory: pipeline
        run: uv run --quiet pytest -q

      - name: Tests admin
        working-directory: admin
        run: |
          npm ci
          npm run check
          npm test
          npm run format:check

      - name: Tests site
        working-directory: site
        run: |
          npm ci
          npm run check
          npm test
          npm run format:check

      - name: Build du site (comme Cloudflare Pages)
        run: bash build.sh
